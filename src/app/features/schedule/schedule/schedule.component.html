<div class="schedule-nav-controls">
  <h2 class="title">{{ headerTitle() }}</h2>
  <div class="time-view-selector tasksmart-view-switch">
    <button
      type="button"
      class="tasksmart-button tasksmart-button--quiet focus-ring time-view-btn e2e-day-view-btn"
      [class.active]="isDayView()"
      [attr.aria-pressed]="isDayView()"
      (click)="selectTimeView('day')"
      [matTooltip]="T.F.SCHEDULE.VIEW_DAY | translate"
      [attr.aria-label]="T.F.SCHEDULE.VIEW_DAY | translate"
    >
      {{ T.F.PLANNER.CALENDAR.DAY | translate }}
    </button>
    <button
      type="button"
      class="tasksmart-button tasksmart-button--quiet focus-ring time-view-btn"
      [class.active]="isWeekView()"
      [attr.aria-pressed]="isWeekView()"
      (click)="selectTimeView('week')"
      [matTooltip]="T.F.SCHEDULE.VIEW_WEEK | translate"
      [attr.aria-label]="T.F.SCHEDULE.VIEW_WEEK | translate"
    >
      {{ T.F.PLANNER.CALENDAR.WEEK | translate }}
    </button>
    <button
      type="button"
      class="tasksmart-button tasksmart-button--quiet focus-ring time-view-btn"
      [class.active]="isMonthView()"
      [attr.aria-pressed]="isMonthView()"
      (click)="selectTimeView('month')"
      [matTooltip]="T.F.SCHEDULE.VIEW_MONTH | translate"
      [attr.aria-label]="T.F.SCHEDULE.VIEW_MONTH | translate"
    >
      {{ T.F.PLANNER.CALENDAR.MONTH | translate }}
    </button>
  </div>

  @if (showCalFilterBtn()) {
    <button
      mat-icon-button
      [matMenuTriggerFor]="calFilterMenu"
      [matTooltip]="T.F.SCHEDULE.CALENDAR_VISIBILITY | translate"
      [attr.aria-label]="T.F.SCHEDULE.CALENDAR_VISIBILITY | translate"
    >
      <mat-icon>event_note</mat-icon>
    </button>
    <mat-menu #calFilterMenu="matMenu">
      <ng-template matMenuContent>
        <div (click)="$event.stopPropagation()">
          @for (provider of enabledCalendarProviders(); track provider.id) {
            <button
              mat-menu-item
              role="menuitemcheckbox"
              [attr.aria-checked]="!hiddenCalendarProviderIds().includes(provider.id)"
              (click)="toggleCalProvider(provider.id)"
            >
              @if (hiddenCalendarProviderIds().includes(provider.id)) {
                <mat-icon>check_box_outline_blank</mat-icon>
              } @else {
                <mat-icon>check_box</mat-icon>
              }
              @if (provider.color) {
                <span
                  class="cal-color-dot"
                  [style.background]="provider.color"
                ></span>
              }
              {{ calProviderLabel(provider) }}
            </button>
          }
        </div>
      </ng-template>
    </mat-menu>
  }

  <div class="date-nav-group">
    <button
      type="button"
      class="tasksmart-icon-button focus-ring"
      (click)="goToPreviousPeriod()"
      [disabled]="isViewingToday()"
      [attr.aria-label]="
        (isMonthView()
          ? T.F.SCHEDULE.PREVIOUS_MONTH
          : isDayView()
            ? T.F.SCHEDULE.PREVIOUS_DAY
            : T.F.SCHEDULE.PREVIOUS_WEEK
        ) | translate
      "
      [matTooltip]="
        (isMonthView()
          ? T.F.SCHEDULE.PREVIOUS_MONTH
          : isDayView()
            ? T.F.SCHEDULE.PREVIOUS_DAY
            : T.F.SCHEDULE.PREVIOUS_WEEK
        ) | translate
      "
    >
      <mat-icon>chevron_left</mat-icon>
    </button>

    <button
      type="button"
      class="today-btn tasksmart-button tasksmart-button--quiet focus-ring"
      (click)="goToToday()"
      [disabled]="isViewingToday()"
      [attr.aria-label]="T.G.TODAY_TAG_TITLE | translate"
      [matTooltip]="T.G.TODAY_TAG_TITLE | translate"
    >
      {{ T.G.TODAY_TAG_TITLE | translate }}
    </button>

    <button
      type="button"
      class="tasksmart-icon-button focus-ring"
      (click)="goToNextPeriod()"
      [attr.aria-label]="
        (isMonthView()
          ? T.F.SCHEDULE.NEXT_MONTH
          : isDayView()
            ? T.F.SCHEDULE.NEXT_DAY
            : T.F.SCHEDULE.NEXT_WEEK
        ) | translate
      "
      [matTooltip]="
        (isMonthView()
          ? T.F.SCHEDULE.NEXT_MONTH
          : isDayView()
            ? T.F.SCHEDULE.NEXT_DAY
            : T.F.SCHEDULE.NEXT_WEEK
        ) | translate
      "
    >
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>

<div
  #scrollWrapper
  class="scroll-wrapper"
  [attr.data-horizontal-scroll]="shouldEnableHorizontalScroll() || null"
  (scroll)="onScrollWrapperScroll($event)"
>
  @if (isMonthView()) {
    <schedule-month
      [events]="monthEvents()"
      [daysToShow]="daysToShow()"
      [weeksToShow]="weeksToShow()"
      [firstDayOfWeek]="firstDayOfWeek()"
    ></schedule-month>
  } @else {
    <schedule-week
      [events]="events()"
      [beyondBudget]="beyondBudget()"
      [daysToShow]="daysToShow()"
      [workStartEnd]="workStartEnd() || null"
      [currentTimeRow]="currentTimeRow()"
      [todayDateStr]="_todayDateStr()"
      [isHorizontalScrollMode]="shouldEnableHorizontalScroll()"
      [isHScrolled]="isHScrolled()"
    ></schedule-week>
  }
</div>
