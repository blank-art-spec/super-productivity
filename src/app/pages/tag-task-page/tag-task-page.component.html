@if (isMatrixAvailable()) {
  <div class="project-view-toolbar tasksmart-page-toolbar">
    <div
      class="tasksmart-view-switch"
      role="group"
      [attr.aria-label]="T.F.TASK_PAGE.VIEW | translate"
    >
      <button
        type="button"
        class="tasksmart-button tasksmart-button--quiet focus-ring"
        [attr.aria-pressed]="!isMatrixView()"
        (click)="isMatrixView.set(false)"
      >
        {{ T.F.TASK_PAGE.LIST | translate }}
      </button>
      <button
        type="button"
        class="tasksmart-button tasksmart-button--quiet focus-ring"
        [attr.aria-pressed]="isMatrixView()"
        (click)="isMatrixView.set(true)"
      >
        {{ T.F.TASK_PAGE.MATRIX | translate }}
      </button>
    </div>
  </div>
}
@if (isMatrixAvailable() && isMatrixView()) {
  <div class="project-matrix">
    @defer {
      <eisenhower-matrix-page [scopeTagId]="tagId()"></eisenhower-matrix-page>
    }
  </div>
} @else {
  <work-view
    [backlogTasks]="backlogTasks()"
    [doneTasks]="doneTasks()"
    [isShowBacklog]="false"
    [undoneTasks]="undoneTasks()"
  ></work-view>
}
